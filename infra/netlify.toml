[build]
  publish = "frontend"
  command = "echo 'Static site, no build required'"

[[redirects]]
  from = "/api/*"
  to = "https://vidhimitra-backend.onrender.com/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
